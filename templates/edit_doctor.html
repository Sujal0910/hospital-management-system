{% extends "base.html" %}

{% block content %}
<h2>Edit Doctor Profile</h2>
<hr>
<div class="row">
    <div class="col-md-8">
        <form method="POST" action="{{ url_for('edit_doctor', doctor_id=doctor.id) }}">
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ doctor.name }}" required>
            </div>
            <div class="mb-3">
                <label for="specialization" class="form-label">Specialization</label>
                <input type="text" class="form-control" id="specialization" name="specialization" value="{{ doctor.specialization }}" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email Address (for login)</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ doctor.user.email }}" required>
            </div>
            <p class="form-text">To reset a password, please use a separate password reset utility.</p>
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('manage_doctors') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
